# Hackways — Local Development Topology
# For production single-VM deployment topology, refer to deploy/docker/docker-compose.prod.yml

name: hackways-dev

networks:
  dev_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:
  # ==========================================
  # 1. DATABASE (PostgreSQL 16)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: hackways_postgres_dev
    restart: unless-stopped
    networks:
      - dev_net
    environment:
      POSTGRES_USER: ${DB_USER:-hackways_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hackways_password}
      POSTGRES_DB: ${DB_NAME:-hackways_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hackways_user} -d ${DB_NAME:-hackways_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. LOCAL MAIL CAPTURE (Mailpit)
  # ==========================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: hackways_mailpit_dev
    restart: unless-stopped
    networks:
      - dev_net
    ports:
      - "8025:8025" # Web UI: http://localhost:8025
      - "1025:1025" # SMTP Port
    environment:
      MP_MAX_MESSAGES: 500
