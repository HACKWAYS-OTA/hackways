name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repository Hygiene & Security Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify No Committed Secrets or .env Files
        run: |
          if [ -f .env ]; then
            echo "ERROR: .env file was committed to repository!"
            exit 1
          fi
          echo "No .env file found. Passed."

      - name: Check for Leaked Private Keys
        run: |
          PATTERN="BEGIN [A-Z0-9 ]*PRIVATE KEY"
          MATCHES=$(grep -rnE "$PATTERN" . --exclude-dir=".git" --exclude-dir=".github" || true)
          if [ -n "$MATCHES" ]; then
            echo "ERROR: Potential private key found in repository:"
            echo "$MATCHES"
            exit 1
          fi
          echo "No private keys detected. Passed."

  backend-ci:
    name: Go Backend CI
    runs-on: ubuntu-latest
    needs: [repo-hygiene]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hackways_test
          POSTGRES_PASSWORD: hackways_test_password
          POSTGRES_DB: hackways_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Check Go Formatting
        run: |
          if [ -d "services/api" ] && [ -f "services/api/go.mod" ]; then
            cd services/api
            UNFORMATTED=$(gofmt -l .)
            if [ -n "$UNFORMATTED" ]; then
              echo "Unformatted Go files detected:"
              echo "$UNFORMATTED"
              exit 1
            fi
            echo "Go formatting clean."
          else
            echo "services/api/go.mod not yet initialized; skipping Go check."
          fi

      - name: Apply Database Migrations
        env:
          DATABASE_URL: postgres://hackways_test:hackways_test_password@localhost:5432/hackways_test?sslmode=disable
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -f services/api/migrations/000001_initial_schema.up.sql

      - name: Run Go Vet & Unit Tests with Race Detector
        env:
          DATABASE_URL: postgres://hackways_test:hackways_test_password@localhost:5432/hackways_test?sslmode=disable
          CGO_ENABLED: '1'
        run: |
          cd services/api
          go vet ./...
          go test ./... -v -race -count=1

  frontend-ci:
    name: Next.js Frontend CI
    runs-on: ubuntu-latest
    needs: [repo-hygiene]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Shared API Client
        run: |
          cd packages/api-client
          npm install
          npm run build
          cd ../..

      - name: Install & Lint Frontend Applications
        run: |
          for APP in core-web public-web organizer-web admin-web; do
            if [ -d "apps/$APP" ] && [ -f "apps/$APP/package.json" ]; then
              echo "=== Checking apps/$APP ==="
              cd apps/$APP
              npm install
              npm run type-check
              npm run lint
              cd ../..
            fi
          done
