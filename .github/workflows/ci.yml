name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.select.outputs.skip }}
      backends: ${{ steps.select.outputs.backends }}
      frontends: ${{ steps.select.outputs.frontends }}
      operations: ${{ steps.select.outputs.operations }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_CHECKS: ${{ inputs.full || false }}
        run: python3 .github/scripts/affected.py

  repo-hygiene:
    name: Repository Hygiene & Security Guard
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 .github/scripts/audit-source.py

  backend-ci:
    name: Go Backend CI (${{ matrix.service }})
    needs: [changes, repo-hygiene]
    if: needs.changes.outputs.backends != '[]' && needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.backends) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hackways_test
          POSTGRES_PASSWORD: hackways_test_password
          POSTGRES_DB: hackways_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://hackways_test:hackways_test_password@localhost:5432/hackways_test?sslmode=disable
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Apply all migrations to isolated PostgreSQL 16
        run: |
          for migration in deploy/migrations/*.up.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f "$migration"
          done
      - name: Formatting, vet and full race/integration tests
        working-directory: services/${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -json -race -count=1 > "$RUNNER_TEMP/$SERVICE-tests.jsonl"
      - uses: sqlc-dev/setup-sqlc@6bd2de0e87f5adfd968b55f140ce55461f71db69 # v4
        with:
          sqlc-version: '1.31.1'
      - name: Compile checked SQL contracts
        working-directory: services/${{ matrix.service }}
        run: sqlc compile
      - name: Test counts
        if: always()
        env:
          SERVICE: ${{ matrix.service }}
        run: python3 .github/scripts/test-summary.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-${{ matrix.service }}
          path: ${{ runner.temp }}/${{ matrix.service }}-tests.jsonl
          retention-days: 1
          if-no-files-found: ignore

  frontend-ci:
    name: Next.js Frontend CI
    needs: [changes, repo-hygiene]
    if: needs.changes.outputs.frontends != '[]' && needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Shared controls and API contract
        run: |
          npm run type-check --workspace @hackways/ui
          npm run lint --workspace @hackways/ui
          npm run build --workspace @hackways/api-client
      - name: Affected application type checks and lint
        env:
          APPS: ${{ needs.changes.outputs.frontends }}
        run: |
          mapfile -t apps < <(python3 -c 'import json,os;print("\n".join(json.loads(os.environ["APPS"])))')
          for app in "${apps[@]}"; do
            npm run type-check --workspace "apps/$app"
            npm run lint --workspace "apps/$app"
          done

  operations-ci:
    name: Deployment tools and ordering regression tests
    needs: [changes, repo-hygiene]
    if: needs.changes.outputs.operations == 'true' && needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
          cache-dependency-path: deploy/deployer/go.mod
      - name: Validate scripts
        run: |
          bash -n deploy/scripts/deploy.sh deploy/scripts/backup-db.sh deploy/scripts/restore-db.sh
          python3 - <<'PY'
          from pathlib import Path
          for path in [*Path('.github/scripts').glob('*.py'), Path('deploy/scripts/run-migrations.py')]:
              compile(path.read_text(), str(path), 'exec')
          PY
      - name: Test deployment ordering with race detection
        working-directory: deploy/deployer
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -v -race -count=1

  result:
    name: CI result
    needs: [changes, repo-hygiene, backend-ci, frontend-ci, operations-ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json,os
          results=json.loads(os.environ['RESULTS'])
          failed=[name for name,item in results.items() if item['result'] not in ('success','skipped')]
          print('Check results:', {name:item['result'] for name,item in results.items()})
          if failed: raise SystemExit('Checks failed: '+', '.join(failed))
          PY
