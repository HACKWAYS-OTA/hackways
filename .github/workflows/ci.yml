name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repository Hygiene & Security Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify No Committed Secrets or .env Files
        run: |
          if [ -f .env ]; then
            echo "ERROR: .env file was committed to repository!"
            exit 1
          fi
          echo "No .env file found. Passed."

      - name: Check for Leaked Private Keys
        run: |
          PATTERN="BEGIN [A-Z0-9 ]*PRIVATE KEY"
          MATCHES=$(grep -rnE "$PATTERN" . --exclude-dir=".git" --exclude-dir=".github" || true)
          if [ -n "$MATCHES" ]; then
            echo "ERROR: Potential private key found in repository:"
            echo "$MATCHES"
            exit 1
          fi
          echo "No private keys detected. Passed."

  backend-ci:
    name: Go Backend CI
    runs-on: ubuntu-latest
    needs: [repo-hygiene]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hackways_test
          POSTGRES_PASSWORD: hackways_test_password
          POSTGRES_DB: hackways_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Apply Database Migrations
        env:
          DATABASE_URL: postgres://hackways_test:hackways_test_password@localhost:5432/hackways_test?sslmode=disable
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          if [ -f "deploy/migrations/000001_initial_schema.up.sql" ]; then
            psql "$DATABASE_URL" -f deploy/migrations/000001_initial_schema.up.sql
          elif [ -f "services/api/migrations/000001_initial_schema.up.sql" ]; then
            psql "$DATABASE_URL" -f services/api/migrations/000001_initial_schema.up.sql
          fi

      - name: Check Go Formatting
        run: |
          for SVC in core-backend global-backend api; do
            if [ -d "services/$SVC" ] && [ -f "services/$SVC/go.mod" ]; then
              echo "=== Checking formatting for services/$SVC ==="
              cd "services/$SVC"
              UNFORMATTED=$(gofmt -l .)
              if [ -n "$UNFORMATTED" ]; then
                echo "Unformatted Go files detected in services/$SVC:"
                echo "$UNFORMATTED"
                exit 1
              fi
              echo "services/$SVC formatting clean."
              cd ../..
            fi
          done

      - name: Run Go Vet & Unit Tests with Race Detector
        env:
          DATABASE_URL: postgres://hackways_test:hackways_test_password@localhost:5432/hackways_test?sslmode=disable
          CGO_ENABLED: '1'
        run: |
          for SVC in core-backend global-backend api; do
            if [ -d "services/$SVC" ] && [ -f "services/$SVC/go.mod" ]; then
              echo "=== Running vet and tests for services/$SVC ==="
              cd "services/$SVC"
              go vet ./...
              go test ./... -v -race -count=1
              cd ../..
            fi
          done

  frontend-ci:
    name: Next.js Frontend CI
    runs-on: ubuntu-latest
    needs: [repo-hygiene]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Shared API Client
        run: |
          cd packages/api-client
          npm install
          npm run build
          cd ../..

      - name: Install & Lint Frontend Applications
        run: |
          for APP in core-web public-web organizer-web admin-web; do
            if [ -d "apps/$APP" ] && [ -f "apps/$APP/package.json" ]; then
              echo "=== Checking apps/$APP ==="
              cd apps/$APP
              npm install
              npm run type-check
              npm run lint
              cd ../..
            fi
          done

  build-and-push-images:
    name: Build & Push Container Image (${{ matrix.component.name }})
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: core-backend
            dockerfile: deploy/docker/Dockerfile.core-backend
          - name: global-backend
            dockerfile: deploy/docker/Dockerfile.global-backend
          - name: public-web
            dockerfile: deploy/docker/Dockerfile.public-web
          - name: core-web
            dockerfile: deploy/docker/Dockerfile.core-web
          - name: organizer-web
            dockerfile: deploy/docker/Dockerfile.organizer-web
          - name: admin-web
            dockerfile: deploy/docker/Dockerfile.admin-web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Lowercase Repository Owner
        id: repo-owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/hackways-${{ matrix.component.name }}:latest
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/hackways-${{ matrix.component.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
