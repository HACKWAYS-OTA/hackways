# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name app.hackways.in;
    return 301 https://$host$request_uri;
}

# Attendee Discovery & Interactive RSVP Flow (app.hackways.in)
server {
    listen 443 ssl http2;
    server_name app.hackways.in;

    ssl_certificate /etc/letsencrypt/live/hackways.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackways.in/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Attendee Web Application Proxy
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://core_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Auth API Endpoints (5r/s burst 5) -> Global Backend
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://global_backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RSVP Registration Endpoint (10r/s burst 5) -> Core Backend
    location /api/v1/rsvps {
        limit_req zone=rsvp_limit burst=5 nodelay;
        proxy_pass http://core_backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Events API -> Core Backend
    location /api/v1/events {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://core_backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
