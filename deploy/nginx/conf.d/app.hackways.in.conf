# Legacy app bookmarks move permanently to the canonical origin.
server {
    listen 80;
    server_name app.hackways.in;
    return 308 https://hackways.in$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name app.hackways.in;
    ssl_certificate /etc/letsencrypt/live/hackways.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackways.in/privkey.pem;
    return 308 https://hackways.in$request_uri;
}
