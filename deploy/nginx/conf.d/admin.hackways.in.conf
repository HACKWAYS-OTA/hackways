# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name admin.hackways.in;
    return 301 https://$host$request_uri;
}

# Network-Isolated Platform Admin Portal (admin.hackways.in)
server {
    listen 443 ssl;
    http2 on;
    server_name admin.hackways.in;

    ssl_certificate /etc/letsencrypt/live/hackways.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackways.in/privkey.pem;

    # ==========================================================================
    # Strict Network Isolation as per AGENTS.md Section 2.6
    # Access restricted to approved office static IPs and VPN subnets
    # ==========================================================================
    allow 10.0.0.0/8;       # Internal VPN subnet
    allow 172.16.0.0/12;    # Docker internal bridge & secure VPC
    allow 192.168.0.0/16;   # Office local subnet
    allow 127.0.0.1;        # Local loopback
    deny all;               # Deny all public internet traffic

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Admin Portal Web Application Proxy
    location / {
        limit_req zone=general_limit burst=10 nodelay;
        set $admin_web "http://admin-web:3003";
        proxy_pass $admin_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend readiness is visible only through this already restricted vhost.
    location = /health/core {
        set $core_backend "http://core-backend:8081";
        proxy_pass $core_backend/health;
        proxy_set_header Host $host;
    }

    location = /health/global {
        set $global_backend "http://global-backend:8082";
        proxy_pass $global_backend/health;
        proxy_set_header Host $host;
    }

    # Administrative Telemetry & Health Inspection
    location /api/v1/ {
        limit_req zone=general_limit burst=10 nodelay;
        set $global_backend "http://global-backend:8082";
        proxy_pass $global_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
