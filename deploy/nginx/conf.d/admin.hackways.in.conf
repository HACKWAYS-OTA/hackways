# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name admin.hackways.in;
    return 301 https://$host$request_uri;
}

# Authenticated Platform Admin Portal (admin.hackways.in)
server {
    listen 443 ssl;
    http2 on;
    server_name admin.hackways.in;

    ssl_certificate /etc/letsencrypt/live/hackways.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackways.in/privkey.pem;

    # Operator-approved policy (2026-10-22): sign in from any network/device.
    # Next.js gates console routes; Go requires a dedicated admin session,
    # an explicit platform grant and daily OTP for privileged API access.
    allow all;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Admin Portal Web Application Proxy
    location / {
        limit_req zone=general_limit burst=10 nodelay;
        set $admin_web "http://admin-web:3003";
        proxy_pass $admin_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Readiness remains internal; public admin access does not expose diagnostics.
    location = /health/core {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        set $core_backend "http://core-backend:8081";
        proxy_pass $core_backend/health;
        proxy_set_header Host $host;
    }

    location = /health/global {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        set $global_backend "http://global-backend:8082";
        proxy_pass $global_backend/health;
        proxy_set_header Host $host;
    }

    # Admin APIs retain their independent Go engines and dedicated sessions.
    location ^~ /api/v1/admin/core/ {
        limit_req zone=general_limit burst=20 nodelay;
        set $core_backend "http://core-backend:8081";
        proxy_pass $core_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/admin/global/ {
        limit_req zone=general_limit burst=20 nodelay;
        set $global_backend "http://global-backend:8082";
        proxy_pass $global_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/auth/admin/ {
        limit_req zone=auth_limit burst=5 nodelay;
        set $global_backend "http://global-backend:8082";
        proxy_pass $global_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace client-supplied values with trusted Cloudflare metadata only.
        proxy_set_header X-Hackways-City $hackways_city;
        proxy_set_header X-Hackways-Region $hackways_region;
        proxy_set_header X-Hackways-Country $hackways_country;
    }

    # Consent uses actual host-only browser admin cookies; the Go handler rechecks OTP.
    location ^~ /api/v1/auth/mcp/ {
        limit_req zone=auth_limit burst=5 nodelay;
        set $global_backend "http://global-backend:8082";
        proxy_pass $global_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        return 404;
    }
}
