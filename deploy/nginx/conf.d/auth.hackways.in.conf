# Keep the auth host on the same trusted origin while the Go OAuth bridge is introduced.
server {
    listen 80;
    server_name auth.hackways.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name auth.hackways.in;

    ssl_certificate /etc/letsencrypt/live/auth.hackways.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.hackways.in/privkey.pem;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Reuse the existing Go auth contract. No separate Better Auth session is exposed.
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        set $global_backend "http://global-backend:8082";
        proxy_pass $global_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
