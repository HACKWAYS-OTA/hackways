# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name organizer.hackways.in;
    return 301 https://$host$request_uri;
}

# Organizer Event Studio & Roster Management (organizer.hackways.in)
server {
    listen 443 ssl;
    http2 on;
    server_name organizer.hackways.in;

    ssl_certificate /etc/letsencrypt/live/hackways.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackways.in/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Organizer Web Application Proxy
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        set $organizer_web "http://organizer-web:3002";
        proxy_pass $organizer_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Storage SAS Intent Generation -> Global Backend
    location /api/v1/storage/ {
        limit_req zone=general_limit burst=10 nodelay;
        set $global_backend "http://global-backend:8082";
        proxy_pass $global_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Event Authoring & Management -> Core Backend
    location /api/v1/events {
        limit_req zone=general_limit burst=20 nodelay;
        set $core_backend "http://core-backend:8081";
        proxy_pass $core_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
