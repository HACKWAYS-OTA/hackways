# Unrecognized hosts must never fall through to the admin virtual host.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    return 444;
}
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    return 444;
}
