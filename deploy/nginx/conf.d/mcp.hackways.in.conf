limit_req_zone $binary_remote_addr zone=mcp_registration:1m rate=1r/m;
# Activate with the CI-built MCP release, migration 24 and MCP_ENABLED=true.
# This independent certificate uses the existing certbot webroot renewal timer.
server {
    listen 80;
    server_name mcp.hackways.in;
    location ^~ /.well-known/acme-challenge/ {
        root /etc/letsencrypt/mcp-acme;
        default_type text/plain;
    }
    location / { return 308 https://mcp.hackways.in$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name mcp.hackways.in;
    ssl_certificate /etc/letsencrypt/live/mcp.hackways.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.hackways.in/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    client_max_body_size 128k;

    location = / { return 308 https://hackways.in/mcp; }
    location = /mcp {
        limit_req zone=general_limit burst=20 nodelay;
        set $mcp_backend "http://global-backend:8082";
        proxy_pass $mcp_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_set_header X-MCP-Intent "";
        proxy_set_header X-MCP-Lease "";
    }
    location = /oauth/register {
        limit_req zone=mcp_registration burst=3 nodelay;
        access_log off;
        set $mcp_backend "http://global-backend:8082";
        proxy_pass $mcp_backend/api/v1/auth/mcp/register;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
    }
    location ~ ^/oauth/(authorize|token|revoke)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        access_log off;
        set $mcp_backend "http://global-backend:8082";
        rewrite ^/oauth/(.*)$ /api/v1/auth/mcp/$1 break;
        proxy_pass $mcp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
    }
    location = /.well-known/oauth-authorization-server {
        limit_req zone=general_limit burst=5 nodelay;
        set $mcp_backend "http://global-backend:8082";
        proxy_pass $mcp_backend/api/v1/auth/mcp/metadata/server;
        proxy_set_header Cookie "";
    }
    location = /.well-known/oauth-protected-resource/mcp {
        limit_req zone=general_limit burst=5 nodelay;
        set $mcp_backend "http://global-backend:8082";
        proxy_pass $mcp_backend/api/v1/auth/mcp/metadata/resource;
        proxy_set_header Cookie "";
    }
    location = /.well-known/oauth-protected-resource {
        limit_req zone=general_limit burst=5 nodelay;
        set $mcp_backend "http://global-backend:8082";
        proxy_pass $mcp_backend/api/v1/auth/mcp/metadata/resource;
        proxy_set_header Cookie "";
    }
    location / { return 404; }
}
