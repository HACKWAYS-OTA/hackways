# The legacy domain is a public handoff only; no auth or application routes.
server {
    listen 80;
    server_name hackways.me www.hackways.me auth.hackways.me join.hackways.me checkin.hackways.me;
    access_log off;
    limit_req zone=general_limit burst=20 nodelay;
    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/conf.d/legacy/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://hackways.me/; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name hackways.me;
    ssl_certificate /etc/letsencrypt/live/hackways.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackways.me/privkey.pem;
    access_log off;
    limit_req zone=general_limit burst=20 nodelay;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self' https://hackways.in; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    error_page 404 /_legacy-page;
    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/conf.d/legacy/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = / { alias /etc/nginx/conf.d/legacy/hackways-me.html; default_type text/html; }
    location = /_legacy-page { internal; alias /etc/nginx/conf.d/legacy/hackways-me.html; default_type text/html; }
    location = /login { return 301 https://hackways.me/; }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nAllow: /\nSitemap: https://hackways.me/sitemap.xml\n"; }
    location = /sitemap.xml { default_type application/xml; return 200 '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://hackways.me/</loc></url></urlset>'; }
    location ~ ^/fonts/(google-sans-flex-regular|fg-futurist-regular)\.woff2$ {
        limit_req zone=general_limit burst=20 nodelay;
        set $legacy_public "http://public-web:3000";
        proxy_pass $legacy_public$uri;
        proxy_set_header Host hackways.in;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }
    location / { return 404; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.hackways.me auth.hackways.me join.hackways.me checkin.hackways.me;
    ssl_certificate /etc/letsencrypt/live/hackways.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackways.me/privkey.pem;
    access_log off;
    limit_req zone=general_limit burst=20 nodelay;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Fixed destination discards obsolete paths and potentially private query strings.
    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/conf.d/legacy/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://hackways.me/; }
}
