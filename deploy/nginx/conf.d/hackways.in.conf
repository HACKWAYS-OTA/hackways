# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name hackways.in www.hackways.in;
    return 301 https://$host$request_uri;
}

# Public Marketing & Catalog Shell (hackways.in)
server {
    listen 443 ssl;
    http2 on;
    server_name hackways.in www.hackways.in;

    ssl_certificate /etc/letsencrypt/live/hackways.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackways.in/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Public Landing Web Proxy
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        set $public_web "http://public-web:3000";
        proxy_pass $public_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Public Event API Endpoints -> Core Backend
    location /api/v1/events {
        limit_req zone=general_limit burst=20 nodelay;
        set $core_backend "http://core-backend:8081";
        proxy_pass $core_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public Health Check
    location /health {
        set $core_backend "http://core-backend:8081";
        proxy_pass $core_backend/health;
        proxy_set_header Host $host;
    }

    # Auto-Deployment Webhook & Dashboard
    location /api/deploy/ {
        set $deployer "http://172.16.0.4:9898";
        proxy_pass $deployer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /deployments {
        set $deployer "http://172.16.0.4:9898/";
        proxy_pass $deployer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
