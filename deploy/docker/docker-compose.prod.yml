version: '3.8'

# ==============================================================================
# Hackways Production Docker Compose Topology
# Hardware Target: Azure VM (Standard_B2s / Standard_D2s_v5)
# Specs: 2 vCPU, 4.0 GB RAM, 50 GB NVMe SSD
# Container limits total 1,800 MB with the optional local PostgreSQL profile,
# or 1,100 MB without it. These limits are configuration, not measured usage.
# ==============================================================================

networks:
  hackways-internal:
    driver: bridge
  hackways-ingress:
    driver: bridge

volumes:
  pgdata:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. Authoritative Database Engine (Optional Local Container Profile)
  # In Azure Production, this is replaced by Azure Database for PostgreSQL Flexible Server.
  # Use profile 'local-db' only if simulating production with a local container.
  # ----------------------------------------------------------------------------
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    container_name: hackways-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hackways_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackways_password}
      POSTGRES_DB: ${POSTGRES_DB:-hackways_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=1GB
      -c max_connections=60
      -c statement_timeout=2000ms
      -c idle_in_transaction_session_timeout=5000ms
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - hackways-internal
    deploy:
      resources:
        limits:
          cpus: '0.60'
          memory: 700M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hackways_user} -d ${POSTGRES_DB:-hackways_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 2. Core Backend Engine (Events & RSVP Capacity Engine)
  # Memory Limit: 120 MB | CPU Quota: 0.70
  # ----------------------------------------------------------------------------
  core-backend:
    image: ${DOCKER_REGISTRY}/hackways-core-backend:${IMAGE_TAG:-latest}
    container_name: hackways-core-backend
    restart: always
    environment:
      PORT: 8081
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB}?sslmode=${DB_SSLMODE:-require}}
      DB_MAX_CONNS: 28
      DB_MIN_CONNS: 4
      GOMEMLIMIT: 100MiB
      GOGC: 100
      APP_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be configured}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.hackways.in,https://hackways.in}
      TICKET_SIGNING_SEED: ${TICKET_SIGNING_SEED:-}
    networks:
      - hackways-internal
    deploy:
      resources:
        limits:
          cpus: '0.70'
          memory: 120M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 3. Global Backend Engine (Auth, Azure SAS Signer, ACS Outbox Worker)
  # Memory Limit: 110 MB | CPU Quota: 0.40
  # ----------------------------------------------------------------------------
  global-backend:
    image: ${DOCKER_REGISTRY}/hackways-global-backend:${IMAGE_TAG:-latest}
    container_name: hackways-global-backend
    restart: always
    environment:
      PORT: 8082
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB}?sslmode=${DB_SSLMODE:-require}}
      DB_MAX_CONNS: 22
      DB_MIN_CONNS: 3
      GOMEMLIMIT: 90MiB
      GOGC: 100
      APP_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be configured}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.hackways.in,https://hackways.in}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY}
      # Enable only after the public CDN hostname has passed HTTPS/origin checks.
      AZURE_CDN_DOMAIN: ${AZURE_CDN_DOMAIN:-}
      AZURE_ACS_CONNECTION_STRING: ${AZURE_ACS_CONNECTION_STRING}
      AZURE_ACS_SENDER_ADDRESS: ${AZURE_ACS_SENDER_ADDRESS}
      ACS_ENDPOINT: ${ACS_ENDPOINT:-}
      ACS_ACCESS_KEY: ${ACS_ACCESS_KEY:-}
      ACS_SENDER_ADDRESS: ${ACS_SENDER_ADDRESS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      GOOGLE_ALLOWED_RETURN_ORIGINS: ${GOOGLE_ALLOWED_RETURN_ORIGINS:-https://hackways.in}
    networks:
      - hackways-internal
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 110M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 4. Public Web (hackways.in - Marketing & Pre-rendered SEO Catalogs)
  # Memory Limit: 140 MB | CPU Quota: 0.25
  # ----------------------------------------------------------------------------
  public-web:
    image: ${DOCKER_REGISTRY}/hackways-public-web:${IMAGE_TAG:-latest}
    container_name: hackways-public-web
    restart: always
    environment:
      PORT: 3000
      NODE_OPTIONS: "--max-old-space-size=100"
      NEXT_PUBLIC_API_URL: https://hackways.in/api/v1
    networks:
      - hackways-internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 140M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 5. Core Web (app.hackways.in - Attendee Discovery & Interactive RSVP)
  # Memory Limit: 250 MB | CPU Quota: 0.50
  # ----------------------------------------------------------------------------
  core-web:
    image: ${DOCKER_REGISTRY}/hackways-core-web:${IMAGE_TAG:-latest}
    container_name: hackways-core-web
    restart: always
    environment:
      PORT: 3001
      NODE_OPTIONS: "--max-old-space-size=190"
      NEXT_PUBLIC_API_URL: https://hackways.in/api/v1
      CORE_API_URL: http://core-backend:8081/api/v1
      GLOBAL_API_URL: http://global-backend:8082/api/v1
    networks:
      - hackways-internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 250M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 6. Organizer Web (organizer.hackways.in - Event Studio & Attendee Roster)
  # Memory Limit: 230 MB | CPU Quota: 0.40
  # ----------------------------------------------------------------------------
  organizer-web:
    image: ${DOCKER_REGISTRY}/hackways-organizer-web:${IMAGE_TAG:-latest}
    container_name: hackways-organizer-web
    restart: always
    environment:
      PORT: 3002
      NODE_OPTIONS: "--max-old-space-size=180"
      NEXT_PUBLIC_API_URL: https://hackways.in/api/v1
      NEXT_PUBLIC_APP_URL: https://hackways.in
      NEXT_PUBLIC_ORGANIZER_URL: https://hackways.in/manage
      CORE_API_URL: http://core-backend:8081/api/v1
      GLOBAL_API_URL: http://global-backend:8082/api/v1
    networks:
      - hackways-internal
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 230M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 7. Admin Web (admin.hackways.in - Network-Isolated Admin & Auditing)
  # Memory Limit: 170 MB | CPU Quota: 0.25
  # ----------------------------------------------------------------------------
  admin-web:
    image: ${DOCKER_REGISTRY}/hackways-admin-web:${IMAGE_TAG:-latest}
    container_name: hackways-admin-web
    restart: always
    environment:
      PORT: 3003
      NODE_OPTIONS: "--max-old-space-size=130"
      NEXT_PUBLIC_API_URL: https://admin.hackways.in/api/v1
      CORE_API_URL: http://core-backend:8081/api/v1
      GLOBAL_API_URL: http://global-backend:8082/api/v1
    networks:
      - hackways-internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 170M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 8. Nginx Ingress Reverse Proxy
  # Memory Limit: 75 MB | CPU Quota: 0.20
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: hackways-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - hackways-ingress
      - hackways-internal
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 80M
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
